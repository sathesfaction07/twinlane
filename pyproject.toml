[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batch-validator"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44",
    "click>=8.1",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
batch-validator = "batch_validator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

line-length = 100
[tool.ruff.lint]
# The portfolio-standard rule set. Absent here, so this project linted against ruff's bare
# defaults while its CI still ran `ruff check` -- which is how findings accumulated unseen.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
[tool.hatch.build.targets.wheel]
packages = ["src/batch_validator"]

[tool.ruff.lint.per-file-ignores]
# Long lines in these files are STRING LITERALS -- log messages and prompt text. Breaking
# them either changes the string or needs implicit concatenation, which makes a log line
# harder to read and a prompt harder to diff. The limit is relaxed per file, visibly, rather
# than scattered as noqa comments.
"src/batch_validator/core/pipeline.py" = ["E501"]
"src/batch_validator/core/vlm_fallback.py" = ["E501"]
